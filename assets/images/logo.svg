<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Shield Outline -->
    <path d="M32 2 C48 2 58 10 60 22 C60 42 42 56 32 62 C22 56 4 42 4 22 C6 10 16 2 32 2 Z" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Inner Ribbon Accent -->
    <path d="M12 20 Q32 30 52 20" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Open Book -->
    <g transform="translate(16, 22)">
      <!-- Left Page -->
      <path d="M16 22 C11 18 4 19 2 20 L2 8 C5 7 11 6 16 10 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Right Page -->
      <path d="M16 22 C21 18 28 19 30 20 L30 8 C27 7 21 6 16 10 Z" fill="#ffffff" opacity="0.95"/>
      <!-- Center binding -->
      <line x1="16" y1="10" x2="16" y2="23" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Torch / Star of Hope -->
    <g transform="translate(32, 12)">
      <polygon points="0,-7 2,-2 7,-2 3,1 5,6 0,3 -5,6 -3,1 -7,-2 -2,-2" fill="url(#goldGrad)"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(82, 34)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Poppins', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#0f2b5c" letter-spacing="0.5">YAYASAN HARAPAN BANGSA</text>
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#d97706" letter-spacing="2.2">KARAWANG • TK - SD - SMP</text>
  </g>
</svg>
